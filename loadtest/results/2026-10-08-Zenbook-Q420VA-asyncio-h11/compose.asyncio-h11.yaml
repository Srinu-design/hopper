  api:
    command: ["uvicorn", "hopper.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio", "--http", "h11"]
  api-2:
    command: ["uvicorn", "hopper.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio", "--http", "h11"]
