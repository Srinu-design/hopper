name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  # The Prometheus config must load, and every alert must fire (and stay quiet) exactly when
  # its unit test says so. Same image version as Compose.
  alerts:
    runs-on: ubuntu-latest
    env:
      PROMTOOL: >-
        docker run --rm -w /etc/prometheus -v ${{ github.workspace }}/deploy/prometheus:/etc/prometheus:ro
        --entrypoint promtool prom/prometheus:v3.15.0
    steps:
      - uses: actions/checkout@v7
      - run: $PROMTOOL check config prometheus.yml
      - run: $PROMTOOL test rules alerts_test.yml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env: { POSTGRES_USER: hopper, POSTGRES_PASSWORD: hopper, POSTGRES_DB: hopper }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hopper" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.11
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hopper:hopper@127.0.0.1:5432/hopper
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  # Delivery, rehearsed on a fresh runner as if it were the server: deploy.sh runs a first
  # deploy and an upgrade, then two releases broken on purpose that must roll back on their
  # own, then a manual rollback, while every request through Caddy is counted
  # (deploy/rehearse.sh). An image whose deploy would fail is never pushed.
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung rehearsal must not hold a runner for hours
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 deploy/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: compose.prod.yaml is valid
        run: |
          mkdir -p /tmp/hopper && printf 'POSTGRES_PASSWORD=x\nGRAFANA_ADMIN_PASSWORD=x\n' > /tmp/hopper/.env
          HOPPER_IMAGE=hopper:ci HOPPER_ROOT=/tmp/hopper docker compose \
            --env-file /tmp/hopper/.env -f docker/compose.prod.yaml config --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: hopper:ci
          cache-from: type=gha
      # good-1 is main's image (the release live in production), so the final rollback runs it
      # on the schema this change migrated to: the backward-compatibility check.
      - name: Rehearse deploys, broken releases and rollbacks
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash deploy/rehearse.sh hopper:ci "ghcr.io/${GITHUB_REPOSITORY,,}:$PREVIOUS_SHA"

  image:
    needs: [lint, alerts, test, delivery]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
