# Run from the repo root:  docker compose -f docker/compose.yaml --env-file .env up
# (make up does this, and runs migrations first)
name: hopper

x-app: &app
  image: ${HOPPER_IMAGE:-hopper:dev}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file: ../.env
  environment: &app-env
    # Inside the Compose network the services are reached by name, not localhost.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hopper}:${POSTGRES_PASSWORD:-hopper}@postgres:5432/${POSTGRES_DB:-hopper}
    REDIS_URL: redis://redis:6379/0
  init: true                       # PID 1 forwards signals
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hopper}
      POSTGRES_DB: ${POSTGRES_DB:-hopper}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]   # dev only; compose.prod.yaml publishes nothing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hopper} -d ${POSTGRES_DB:-hopper}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]      # dev only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]        # dev only; Caddy is the public entry point later
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: ["python", "-m", "hopper.worker"]   # exec form: Python receives SIGTERM
    stop_grace_period: 30s                       # > SHUTDOWN_GRACE_SECONDS (25), so SIGKILL never comes first
    deploy: { replicas: 3 }                      # scale further with: up -d --scale worker=N
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  scheduler:
    <<: *app
    command: ["python", "-m", "hopper.scheduler"]   # cron, reaper, queue-depth and retention loops
    deploy: { replicas: 2 }                         # safe without leader election: SKIP LOCKED
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Every app container serves metrics on port 9100 inside the network (never published).
  # Prometheus finds each replica through Docker's DNS; Grafana is provisioned from the repo.
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../deploy/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]   # dev only; never published on a server
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anyone who can reach Grafana can look, nobody can edit without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/hopper.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]      # dev only
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  promdata: {}
  grafanadata: {}
