# Provisioned on Grafana's first boot: the dashboard refers to this data source by uid.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s # the scrape interval, so $__rate_interval never drops below 4 scrapes
